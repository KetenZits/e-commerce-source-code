name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-com-source-code
    env:
      DATABASE_URL: mysql://user:pass@localhost:3306/atelier
      NEXTAUTH_SECRET: ci-secret-change-me-please-16
      DIGITAL_SECRETS_KEY: ci-digital-secret-key-16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-com-source-code/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
